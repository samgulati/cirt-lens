name: CI
on: [push, pull_request]
permissions: {contents: read, security-events: write}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: cirt_test, POSTGRES_USER: cirt, POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cirt" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements-dev.txt pip-audit
      - name: Backend quality gates
        run: |
          black --check backend
          ruff check backend load-tests
          mypy backend/app/auth.py backend/app/connectors.py backend/app/services/attack_mapping.py backend/app/services/correlation_engine.py backend/app/services/detection_engine.py backend/app/services/investigation_ai.py backend/app/services/playbook_engine.py backend/app/services/risk_engine.py backend/app/services/scenario_generator.py
          python backend/scripts/check_licenses.py
      - run: alembic upgrade head
        working-directory: backend
        env: {DATABASE_URL: "postgresql+psycopg://cirt:test@localhost:5432/cirt_test"}
      - run: pytest -q
        working-directory: backend
      - run: PYTHONPATH=. python evaluation/run_evaluation.py
        working-directory: backend
      - name: Run deterministic scale guardrails
        working-directory: backend
        run: |
          PYTHONPATH=. python benchmarks/benchmark_pipeline.py
          PYTHONPATH=. python benchmarks/correlation_benchmark.py
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && node scripts/check-licenses.mjs && npm run format:check && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: cirt-lens:${{ github.sha }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: cirt-lens:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        if: always()
        with: {sarif_file: trivy.sarif}
      - name: Enforce fixable HIGH/CRITICAL vulnerability gate
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.2 image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          cirt-lens:${{ github.sha }}
