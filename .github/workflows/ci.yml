name: CI
on: [push, pull_request]
permissions: {contents: read, security-events: write}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: cirt_test, POSTGRES_USER: cirt, POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cirt" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt pip-audit
      - run: alembic upgrade head
        working-directory: backend
        env: {DATABASE_URL: "postgresql+psycopg://cirt:test@localhost:5432/cirt_test"}
      - run: pytest -q
        working-directory: backend
      - run: PYTHONPATH=. python evaluation/run_evaluation.py
        working-directory: backend
      - name: Run deterministic scale guardrails
        working-directory: backend
        run: |
          PYTHONPATH=. python benchmarks/benchmark_pipeline.py
          PYTHONPATH=. python benchmarks/correlation_benchmark.py
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env:
          E2E_PYTHON: python
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cirt-lens:${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cirt-lens:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: trivy.sarif}
      - name: Enforce fixable HIGH/CRITICAL vulnerability gate
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.2 image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          cirt-lens:${{ github.sha }}
