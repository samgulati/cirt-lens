[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses call defaults.

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E702"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["backend/alembic"]

[[tool.mypy.overrides]]
module = ["app.models", "app.schemas.*"]
disable_error_code = ["valid-type"]
